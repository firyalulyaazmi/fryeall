<header class="banner mini">
    <div class="overlay">
        <img src="https://logos-world.net/wp-content/uploads/2020/12/Hogwarts-Emblem.png"
             alt="Hogwarts Logo"
             class="hogwarts-logo">
        <h1>Pendaftaran Siswa Baru</h1>

    <a href="index.html">Home</a>

<section class="form-section">
    <form class="form-card">
        <h2>Pendaftaran Calon Penyihir Hogwarts</h2>

        <label>Nama Lengkap</label>
        <input type="text" placeholder="Masukkan nama lengkap" required>

        <label>Email</label>
        <input type="email" placeholder="contoh@email.com" required>

        <label>Jenis Kelamin</label>
        <select required>
            <option value="">-- Pilih --</option>
            <option>Laki-laki</option>
            <option>Perempuan</option>
        </select>

        <label>Pilih Asrama</label>
        <select required>
            <option value="">-- Pilih Asrama --</option>
            <option>Gryffindor</option>
            <option>Slytherin</option>
            <option>Ravenclaw</option>
            <option>Hufflepuff</option>
        </select>

        <label>Alasan Masuk Hogwarts</label>
        <textarea placeholder="Tuliskan alasan Anda..." required></textarea>

        <button type="submit">Daftar Sekarang</button>
    </form>
</section>
